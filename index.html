
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sujit Kumar | Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #portfolio {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="portfolio"
    src="https://sujitkm.sujitkumar.workers.dev/"
    title="Sujit Kumar Portfolio"
    allowfullscreen>
  </iframe>

  <script>
    const PORTFOLIO_ORIGIN =
      "https://sujitkm.sujitkumar.workers.dev";

    window.addEventListener("message", (event) => {
      if (event.origin !== PORTFOLIO_ORIGIN) return;

      const data = event.data;

      if (!data || data.type !== "PORTFOLIO_NAV") return;

      const path = data.path;

      if (
        typeof path !== "string" ||
        !path.startsWith("/") ||
        path.startsWith("//")
      ) return;

      if (data.mode === "push") {
        history.pushState(null, "", path);
      } else {
        history.replaceState(null, "", path);
      }
    });

    window.addEventListener("popstate", () => {
      const iframe = document.getElementById("portfolio");
      iframe.contentWindow.postMessage(
        {
          type: "PARENT_NAV",
          path: location.pathname +
                location.search +
                location.hash
        },
        PORTFOLIO_ORIGIN
      );
    });
  </script>
</body>
</html>

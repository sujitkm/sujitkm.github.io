
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sujit Kumar | Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #portfolio {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe
    id="portfolio"
    title="Sujit Kumar Portfolio"
    allowfullscreen>
  </iframe>

  <script>
    const PORTFOLIO_ORIGIN =
      "https://sujitkm.sujitkumar.workers.dev";

    const iframe = document.getElementById("portfolio");

    // Load the exact URL requested by the visitor.
    function loadPortfolio(path) {
      if (
        typeof path !== "string" ||
        !path.startsWith("/") ||
        path.startsWith("//")
      ) return;

      iframe.src = PORTFOLIO_ORIGIN + path;
    }

    // Initial page load: preserve pathname, query and hash.
    const initialPath =
      location.pathname + location.search + location.hash;

    loadPortfolio(initialPath);

    // Receive navigation updates from Cloudflare.
    window.addEventListener("message", (event) => {
      if (event.origin !== PORTFOLIO_ORIGIN) return;

      const data = event.data;

      if (!data || data.type !== "PORTFOLIO_NAV") return;

      const path = data.path;

      if (
        typeof path !== "string" ||
        !path.startsWith("/") ||
        path.startsWith("//")
      ) return;

      if (data.mode === "push") {
        history.pushState(null, "", path);
      } else {
        history.replaceState(null, "", path);
      }
    });

    // Browser back/forward navigation.
    window.addEventListener("popstate", () => {
      const path =
        location.pathname + location.search + location.hash;

      loadPortfolio(path);
    });
  </script>

</body>
</html>
